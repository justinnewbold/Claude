[pytest]
# Pytest configuration for Vault 13 game collection

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Test paths
testpaths = tests

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    game: marks tests for specific games

# Ignore patterns
norecursedirs = .git .tox dist build *.egg deploy

# Coverage options (requires pytest-cov)
# Uncomment when pytest-cov is installed
# addopts = --cov=. --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
