<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12151c"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>

  <!-- Border glow -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.3"/>

  <!-- Vault door circle -->
  <circle cx="256" cy="220" r="120" fill="none" stroke="url(#textGrad)" stroke-width="8"/>
  <circle cx="256" cy="220" r="100" fill="none" stroke="#00ff88" stroke-width="4" opacity="0.5"/>

  <!-- Inner vault design -->
  <circle cx="256" cy="220" r="60" fill="none" stroke="#00ff88" stroke-width="3"/>
  <circle cx="256" cy="220" r="20" fill="#00ff88"/>

  <!-- Vault handle lines -->
  <line x1="256" y1="140" x2="256" y2="100" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
  <line x1="176" y1="220" x2="136" y2="220" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
  <line x1="336" y1="220" x2="376" y2="220" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="300" x2="256" y2="340" stroke="#00ff88" stroke-width="6" stroke-linecap="round"/>

  <!-- "13" text -->
  <text x="256" y="245" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#0a0a0f" text-anchor="middle">13</text>

  <!-- VAULT text -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="8">VAULT</text>

  <!-- Decorative lines -->
  <line x1="80" y1="460" x2="180" y2="460" stroke="#00ff88" stroke-width="3" opacity="0.5"/>
  <line x1="332" y1="460" x2="432" y2="460" stroke="#00ff88" stroke-width="3" opacity="0.5"/>
</svg>
