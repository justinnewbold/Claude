[mypy]
# Global mypy configuration for Vault 13 Game Collection
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = False  # Start lenient, tighten over time
check_untyped_defs = True
no_implicit_optional = True
strict_optional = True
ignore_missing_imports = True

# Output
show_error_codes = True
pretty = True
color_output = True

# Specific module overrides
[mypy-tests.*]
disallow_untyped_defs = False
ignore_errors = False

# New infrastructure modules (enforce strict typing)
[mypy-base_game]
disallow_untyped_defs = True

[mypy-validation]
disallow_untyped_defs = True

[mypy-save_system]
disallow_untyped_defs = True

[mypy-achievements]
disallow_untyped_defs = True

[mypy-logging_config]
disallow_untyped_defs = True

# Legacy modules (ignore for now, migrate gradually)
[mypy-vault_shelter_v6]
ignore_errors = True

[mypy-vault_shelter_v5.*]
ignore_errors = True

[mypy-api.*]
ignore_errors = True
